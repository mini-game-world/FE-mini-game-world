name: Deploy To S3

on:
  push:
    branches:
      - develop

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.16.0

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: |
          npm install --save-dev @babel/plugin-proposal-private-property-in-object
          npm run build
        env:
          CI: false

      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert PNG to WebP
        run: |
          find ./dist -name '*.png' -exec sh -c 'cwebp "$0" -o "${0%.png}.webp"' {} \;

      - name: Remove original PNG files
        run: find ./dist -name '*.png' -delete

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Delete existing files from S3
        run: aws s3 rm s3://mini-game-world-web --recursive --include "*"

      - name: Upload WebP files with correct MIME type
        run: |
          find ./dist -name '*.webp' -exec bash -c 'aws s3 cp "$1" s3://mini-game-world-web/"${1#./dist/}" --content-type image/webp' _ {} \;

      - name: Sync remaining files to S3
        run: |
          find ./dist -name '*.webp' -prune -o -type f -exec bash -c 'aws s3 cp "$1" s3://mini-game-world-web/"${1#./dist/}"' _ {} \;

      - name: Cloudfront 캐시 무효화
        run: aws cloudfront create-invalidation --distribution-id E1WQE1CPEFVIRJ --paths "/*"
